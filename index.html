<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>وصلّي | نظام إدارة التوصيل</title>

<style>
:root{
 --purple:#6b2fb8;
 --purple-dark:#4d2088;
 --purple-light:#eee4fa;
 --turquoise:#20c8c3;
 --bg:#f6f3f9;
 --white:#fff;
 --text:#241d2f;
 --muted:#77727f;
 --border:#e7e1ed;
 --success:#20a36a;
 --danger:#d94b5b;
 --warning:#e7a51b;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,Tahoma,sans-serif;
 background:var(--bg);
 color:var(--text);
}

button,input,select{font-family:inherit}

.app{min-height:100vh;display:flex}

.sidebar{
 position:fixed;
 right:0;top:0;bottom:0;
 width:250px;
 background:var(--purple);
 color:#fff;
 padding:22px 15px;
 z-index:20;
}

.logo{text-align:center;margin-bottom:28px}

.logo-symbol{
 width:58px;height:58px;
 margin:auto;
 border-radius:18px;
 background:#fff;
 color:var(--purple);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:28px;
 font-weight:bold;
 box-shadow:0 8px 20px #0002;
}

.logo-name{
 font-size:29px;
 font-weight:bold;
 margin-top:9px;
}

.logo-name span{color:var(--turquoise)}

.logo-subtitle{
 font-size:11px;
 opacity:.7;
 margin-top:4px
}

.menu-title{
 font-size:11px;
 opacity:.55;
 margin:20px 12px 9px
}

.menu-item{
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px 14px;
 border-radius:12px;
 margin-bottom:5px;
 cursor:pointer;
 font-size:14px;
 transition:.2s;
}

.menu-item:hover,.menu-item.active{
 background:#ffffff25
}

.menu-icon{
 width:23px;
 text-align:center;
 font-size:18px
}

.main{
 width:calc(100% - 250px);
 margin-right:250px;
 padding:25px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:22px
}

.welcome h1{font-size:25px;margin-bottom:5px}
.welcome p{font-size:13px;color:var(--muted)}

.admin-profile{
 display:flex;
 align-items:center;
 gap:10px;
 background:#fff;
 border:1px solid var(--border);
 padding:8px 13px;
 border-radius:14px
}

.avatar{
 width:39px;height:39px;
 border-radius:50%;
 background:var(--purple-light);
 color:var(--purple);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold
}

.page{display:none}
.page.active{display:block}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-bottom:20px
}

.stat-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:18px;
 padding:18px;
}

.stat-icon{
 width:43px;height:43px;
 border-radius:13px;
 background:var(--purple-light);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
 margin-bottom:12px
}

.stat-card h3{font-size:26px;margin-bottom:5px}
.stat-card p{font-size:12px;color:var(--muted)}

.grid{
 display:grid;
 grid-template-columns:1.5fr 1fr;
 gap:18px
}

.card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:18px;
 padding:19px;
 margin-bottom:18px
}

.card-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:16px
}

.card-header h2{font-size:17px}

.btn{
 border:0;
 border-radius:10px;
 padding:10px 15px;
 cursor:pointer;
 font-size:12px;
 font-weight:bold;
}

.btn-primary{
 background:var(--purple);
 color:#fff
}

.btn-primary:hover{background:var(--purple-dark)}

.btn-turquoise{
 background:var(--turquoise);
 color:#123
}

.btn-danger{
 background:#ffe5e8;
 color:var(--danger)
}

.btn-light{
 background:var(--purple-light);
 color:var(--purple)
}

.table-wrap{overflow-x:auto}

table{
 width:100%;
 border-collapse:collapse;
 min-width:650px
}

th,td{
 text-align:right;
 padding:13px 9px;
 border-bottom:1px solid var(--border);
 font-size:12px
}

th{
 color:var(--muted);
 font-size:11px
}

.badge{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 font-size:10px
}
